<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine?</title>
  <style>
    :root {
      --bg: #ffd6e5;
      --card: #ffffff;
      --yes: #ff4d6d;
      --no: #bdbdbd;
      --text: #222;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg);
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      width: min(520px, 92vw);
      background: var(--card);
      border-radius: 18px;
      padding: 28px 22px 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 10px 0 18px;
      font-size: clamp(22px, 3.8vw, 30px);
      color: var(--text);
    }

    .dog {
      width: 220px;
      max-width: 55vw;
      height: auto;
      display: block;
      margin: 0 auto 14px;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 650;
      transition: opacity 0.12s ease; /* no transform animation */
      touch-action: manipulation;
      min-width: 110px;
    }

    /* Keep original Yes look */
    #yesBtn {
      background: var(--yes);
      color: white;
    }

    /* New No button (no hover behaviour) */
    #noBtn {
      background: var(--no);
      color: #222;
    }

    /* Ensure NOTHING happens on hover */
    #noBtn:hover { transform: none; }

    .result {
      margin-top: 14px;
      font-size: 18px;
      font-weight: 600;
      min-height: 26px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <img class="dog" src="dog.png" alt="Cute dog holding roses" />
    <h1>Tanvee, will you be my valentine? 💘</h1>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const result = document.getElementById("result");

    // Start values match the CSS above
    let padY = 12, padX = 18, font = 16, minW = 110;

    // Only shrink on click/tap (no hover, no moving)
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();

      padY = Math.max(6, Math.round(padY * 0.90));
      padX = Math.max(10, Math.round(padX * 0.90));
      font = Math.max(12, Math.round(font * 0.95));
      minW = Math.max(60, Math.round(minW * 0.92));

      noBtn.style.padding = `${padY}px ${padX}px`;
      noBtn.style.fontSize = `${font}px`;
      noBtn.style.minWidth = `${minW}px`;
    });

    yesBtn.addEventListener("click", () => {
      result.textContent = "Yessss! 💖 I came crawling back! 😄";
      noBtn.style.display = "none";
      yesBtn.disabled = true;
      yesBtn.style.opacity = "0.85";
    });
  </script>
</body>
</html>
