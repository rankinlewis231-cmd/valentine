<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine?</title>
  <style>
    :root {
      --bg: #ffd6e5;
      --card: #ffffff;
      --yes: #ff4d6d;
      --no: #bdbdbd;
      --text: #222;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg);
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      width: min(520px, 92vw);
      background: var(--card);
      border-radius: 18px;
      padding: 28px 22px 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 10px 0 18px;
      font-size: clamp(22px, 3.8vw, 30px);
      color: var(--text);
    }

    .dog {
      width: 220px;
      max-width: 55vw;
      height: auto;
      display: block;
      margin: 0 auto 14px;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
      flex-wrap: nowrap;
      align-items: center;
    }

    button {
      border: 0;
      padding: 16px 26px;
      font-size: 18px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 650;
      transition: opacity 0.12s ease;
      touch-action: manipulation;
      min-width: 120px;
    }

    #yesBtn {
      background: var(--yes);
      color: white;
    }

    #noBtn {
      background: var(--no);
      color: #222;
    }

    .result {
      margin-top: 14px;
      font-size: 18px;
      font-weight: 600;
      min-height: 26px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <img class="dog" src="dog.png" alt="Cute dog holding roses" />
    <h1>Tanvee, will you be my valentine? 💘</h1>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const result = document.getElementById("result");

    // Starting size values for the No button (match CSS defaults)
    let padY = 16;
    let padX = 26;
    let font = 18;
    let minW = 120;

    // Each click/tap makes "No" smaller (without moving position)
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();

      // shrink a little each time, with sensible minimums
      padY = Math.max(6, Math.round(padY * 0.85));
      padX = Math.max(10, Math.round(padX * 0.85));
      font = Math.max(12, Math.round(font * 0.92));
      minW = Math.max(60, Math.round(minW * 0.90));

      noBtn.style.padding = `${padY}px ${padX}px`;
      noBtn.style.fontSize = `${font}px`;
      noBtn.style.minWidth = `${minW}px`;

      // Once it's very small, fade it out and disable it
      if (minW <= 62 && padY <= 6) {
        noBtn.style.opacity = "0";
        noBtn.style.pointerEvents = "none";
      }
    });

    yesBtn.addEventListener("click", () => {
      result.textContent = "Yessss! 💖 I came crawling back! 😄";
      noBtn.style.display = "none";
      yesBtn.disabled = true;
      yesBtn.style.opacity = "0.85";
    });
  </script>
</body>
</html>
