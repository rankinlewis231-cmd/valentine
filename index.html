<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine?</title>
  <style>
    :root {
      --bg: #ffd6e5;
      --card: #ffffff;
      --yes: #ff4d6d;
      --no: #bdbdbd;
      --text: #222;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg);
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      width: min(520px, 92vw);
      background: var(--card);
      border-radius: 18px;
      padding: 28px 22px 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 10px 0 18px;
      font-size: clamp(22px, 3.8vw, 30px);
      color: var(--text);
    }

    .dog {
      width: 220px;
      max-width: 55vw;
      height: auto;
      display: block;
      margin: 0 auto 14px;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 650;
      transition: transform 0.08s ease;
      touch-action: manipulation;
    }

    button:active { transform: scale(0.98); }

    #yesBtn {
      background: var(--yes);
      color: white;
    }

    /* The "No" button is positioned absolutely so it can run away */
    #noBtn {
      background: var(--no);
      color: #222;
      position: absolute;
      left: 50%;
      top: calc(50% + 120px);
      transform: translateX(-50%);
    }

    .result {
      margin-top: 14px;
      font-size: 18px;
      font-weight: 600;
      min-height: 26px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <img class="dog" src="dog.png" alt="Cute dog holding roses" />
    <h1>Tanvee, will you be my valentine? 💘</h1>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <!-- "No" lives outside the card so it can move around the page -->
  <button id="noBtn" aria-label="No">No</button>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const result = document.getElementById("result");

    function moveNoButton() {
      const padding = 12;

      // Button size
      const btnW = noBtn.offsetWidth;
      const btnH = noBtn.offsetHeight;

      // Viewport bounds
      const maxX = window.innerWidth - btnW - padding;
      const maxY = window.innerHeight - btnH - padding;

      // Random position within bounds
      const x = Math.max(padding, Math.floor(Math.random() * maxX));
      const y = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.transform = "none";
    }

    // Make "No" run away on hover (desktop) and touch (mobile)
    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    }, { passive: false });

    // If they somehow click it, still refuse 😄
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener("click", () => {
      result.textContent = "Yessss! 💖 I came crawling back! 😄";
      noBtn.style.display = "none";
      yesBtn.disabled = true;
      yesBtn.style.opacity = "0.85";
    });

    // Place "No" somewhere sensible at the start
    window.addEventListener("load", () => {
      // Start near bottom-ish
      noBtn.style.left = "50%";
      noBtn.style.top = "70%";
      noBtn.style.transform = "translateX(-50%)";
    });

    // Keep it on-screen after resize
    window.addEventListener("resize", () => {
      // if it ends up off-screen, move it back in
      const rect = noBtn.getBoundingClientRect();
      if (rect.right > window.innerWidth || rect.bottom > window.innerHeight || rect.left < 0 || rect.top < 0) {
        moveNoButton();
      }
    });
  </script>
</body>
</html>
